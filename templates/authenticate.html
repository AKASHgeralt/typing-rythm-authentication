{% extends "base.html" %}
{% block title %}Login | Typing Rhythm Authentication{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Login</h1>
  <p class="muted">The password must be correct, and it must be typed with the account owner's rhythm.</p>
  <form id="login-form" autocomplete="off" novalidate>
    <label for="email" class="field-label">Email</label>
    <input id="email" class="pw-input" type="email" autocomplete="off" spellcheck="false">
    <label for="pw" class="field-label">Password</label>
    <input id="pw" class="pw-input" type="password" autocomplete="new-password" spellcheck="false">
    <button id="login-btn" class="btn" type="submit">Login</button>
  </form>
  <p id="status" class="status info"></p>
</section>

<section id="result" class="card result hidden" aria-live="polite">
  <p id="verdict" class="verdict"></p>
  <p id="explain" class="muted"></p>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/capture.js') }}"></script>
<script src="{{ url_for('static', filename='js/authenticate.js') }}"></script>
{% endblock %}
